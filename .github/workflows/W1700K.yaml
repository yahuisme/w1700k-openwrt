name: W1700K Firmware

on:
  workflow_dispatch:

  # Monthly days 1, 4, 7, 10... at 00:00 Hong Kong time.
  schedule:
    - cron: '0 0 1-31/3 * *'
      timezone: Asia/Hong_Kong
concurrency:
  group: w1700k-cache
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
jobs:
  openwrt:
    name: OpenWrt
    uses: ./.github/workflows/build-firmware.yaml
    with:
      system: openwrt
      title: OpenWrt
      tc: tc-v3-ubi2-
      cc: cc-v3-ubi2.
      dl: dl-v3.
      tb: tb-v1-ubi2-
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  immortalwrt:
    name: ImmortalWrt
    needs: openwrt
    # Serialize shared cache writers, but do not cascade build failures.
    if: ${{ !cancelled() && needs.openwrt.result != 'cancelled' }}
    uses: ./.github/workflows/build-firmware.yaml
    with:
      system: immortalwrt
      title: ImmortalWrt
      tc: tc-v3-immortalwrt-
      cc: cc-v3-immortalwrt.
      dl: dl-v3-immortalwrt.
      tb: tb-v1-immortalwrt-
    secrets:
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
