name: W1700K OpenWrt Builds

on:
  workflow_dispatch:

  # GitHub Actions uses UTC; 12:00 Hong Kong time = 04:00 UTC, every two days.
  schedule:
    - cron: '0 4 */2 * *'
concurrency:
  group: w1700k-cache
  cancel-in-progress: false
permissions:
  actions: write
  contents: write
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04-arm
    strategy: {fail-fast: false, matrix: {target: [ubi2, ubi2-oc]}}
    env:
      DK_OPENWRT: /bld/openwrt
      DK_BIN: /bld/openwrt_bin
      DK_USER: /bld/user
      DK_PROFILE: /bld/user/current
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@main

    # Rolling caches contain no staging or build stamps.
    - id: gh
      uses: actions/cache/restore@main
      with: {path: ccarchive, key: 'cc-v3-${{ matrix.target }}.${{ github.run_id }}.${{ github.run_attempt }}', restore-keys: 'cc-v3-${{ matrix.target }}.'}
    - id: dl
      uses: actions/cache/restore@main
      with: {path: dlarchive, key: 'dl-v3.${{ github.run_id }}.${{ github.run_attempt }}', restore-keys: 'dl-v3.'}
    - name: Restore legacy downloads
      if: steps.dl.outputs.cache-matched-key == ''
      uses: actions/cache/restore@main
      with: {path: dlcache, key: 'dlcache.${{ github.run_id }}', restore-keys: 'dlcache.'}
    - name: Restore legacy compiler cache
      if: steps.gh.outputs.cache-matched-key == ''
      uses: actions/cache/restore@main
      with: {path: "ghcache\nstcache", key: 'cache-${{ matrix.target }}.${{ github.run_id }}', restore-keys: 'cache-${{ matrix.target }}.'}
    - name: Unpack rolling caches
      run: |
        mkdir -p openwrt_bin ghcache dlcache tcarchive ccarchive dlarchive
        if [ -f ccarchive/ccache.tar.gz ]; then tar --gzip -xf ccarchive/ccache.tar.gz -C ghcache; fi
        if [ -f dlarchive/dl.tar.gz ]; then tar --gzip -xf dlarchive/dl.tar.gz -C dlcache; fi

    - name: Fingerprint restored downloads
      if: matrix.target == 'ubi2'
      run: sudo python3 scripts/dlcache.py snapshot dlcache "$RUNNER_TEMP/dlcache-before.json"

    - name: Initialize environment
      run: |
        curl --fail --create-dirs -Lo user/default/files/etc/apk/repositories.d/distfeeds.list https://w1700k.github.io/builds/distfeeds.list
        curl --fail -Lo user/default/files/etc/vermagic.txt https://w1700k.github.io/builds/vermagic.txt
        [ -f "user/default/config.diff" ] || { echo "::error::config.diff not found"; exit 1; }
        rsync -aI --mkpath user/default/ user/current/ 2>&-
        echo 'CONFIG_CCACHE_DIR="/ghcache"' >> user/current/config.diff
        sudo tee /etc/docker/daemon.json <<< '{"max-concurrent-downloads":50,"max-concurrent-uploads":50,"experimental":true}'
        sudo systemctl reload docker
        IMAGE=ghcr.io/w1700k/fastbuild_base:base-builder
        docker pull $IMAGE
        IMAGE_ID=$(docker image inspect --format "{{.Id}}" $IMAGE)
        echo "IMAGE_ID=$IMAGE_ID" >> "$GITHUB_ENV"
        docker run -dt --name DK -v $PWD/user:$DK_USER -v $PWD/openwrt_bin:$DK_BIN -v $PWD/ghcache:/ghcache -v $PWD/scripts:/cache-scripts:ro -v $PWD/tcarchive:/tcarchive -v $PWD/ccarchive:/ccarchive -v $PWD/dlarchive:/dlarchive -v $PWD/dlcache:/dlcache $IMAGE
        install -m 755 /dev/stdin /usr/local/bin/docker_exec <<'DKR'
        #!/bin/bash
        for n in DK_BIN DK_USER DK_PROFILE DK_OPENWRT; do e+=(-e "$n=${!n}"); done
        exec docker exec -u 0 -i "${e[@]}" "$@"
        DKR

    - name: Prepare OpenWrt source
      run: |
        docker_exec DK bash -e -c '
          REPO_URL="https://github.com/OpenWRT-fanboy/OpenW1700k"
          REPO_BRANCH="${{ matrix.target }}"
          mkdir -p $DK_OPENWRT/files
          cd $DK_OPENWRT
          if [ ! -d .git ]; then git init; fi
          git remote set-url origin $REPO_URL 2>&- || git remote add origin $REPO_URL
          git fetch origin "+refs/heads/$REPO_BRANCH:refs/remotes/origin/$REPO_BRANCH" && git checkout -f $REPO_BRANCH
          git reset --hard origin/$REPO_BRANCH
          mountpoint $DK_BIN || { echo "::error::not mounted" >&2; exit 1; }
          rm -rf bin dl staging_dir build_dir
          ln -s $DK_BIN bin && ln -s /dlcache dl
          rm -rf feeds/* &>/dev/null
          ./scripts/feeds update -a &>/dev/null || { echo "::error::feeds update failed"; exit 1; }
          ./scripts/feeds install -a &>/dev/null || { echo "::error::feeds install failed"; exit 1; }
          cp $DK_PROFILE/config.diff .config
          cp -r $DK_PROFILE/files/ .
          rm -f files/build_info  # clear build_info pre-seeded in the base-builder image
          bash $DK_PROFILE/custom.sh
          make defconfig; echo "CONFIG_VERSION_NUMBER=${{ matrix.target }}" >> .config
          make download -j8 || exit 1
        '

    - name: Fingerprint prepared source
      id: inputs
      run: |
        KEY=$(docker_exec DK python3 /cache-scripts/cache.py key "$DK_OPENWRT" /tcarchive "$IMAGE_ID")
        echo "key=tc-v3-${{ matrix.target }}-$KEY" >> "$GITHUB_OUTPUT"
    - id: tc
      uses: actions/cache/restore@main
      with:
        path: tcarchive
        key: ${{ steps.inputs.outputs.key }}
        # No restore-keys: toolchain artifacts must be an exact match.
    - name: Restore matched toolchain
      run: docker_exec DK python3 /cache-scripts/cache.py restore "$DK_OPENWRT" /tcarchive '${{ steps.inputs.outputs.key }}'

    - name: Compile OpenWrt
      run: |
        docker_exec DK bash -e -c '
          cd $DK_OPENWRT
          export FORCE_UNSAFE_CONFIGURE=1 CCACHE_MAXSIZE=1.5G CCACHE_NOHASHDIR=true CCACHE_COMPILERCHECK=content
          CCACHE=staging_dir/host/bin/ccache
          [ -x "$CCACHE" ] || make tools/ccache/compile -j$(($(nproc) + 1))
          $CCACHE -d /ghcache --zero-stats
          trap "$CCACHE -d /ghcache -sz ||:" EXIT
          make -j$(($(nproc) + 1)) || make -j1 V=s
        '

    # Go can add dl/go-mod-cache entries during compilation, after make download.
    - name: Check download changes
      id: dl_changed
      if: matrix.target == 'ubi2'
      run: sudo python3 scripts/dlcache.py check dlcache "$RUNNER_TEMP/dlcache-before.json" --restored '${{ steps.dl.outputs.cache-matched-key }}' >> "$GITHUB_OUTPUT"

    - name: Stage firmware
      run: |
        sudo chown -R "$(id -u):$(id -g)" openwrt_bin
        find -L openwrt_bin/targets/*/* -maxdepth 1 \( -name '*sysupgrade.itb' -o -name 'profiles.json' \) -exec install -D -t firmware {} +
        PREFIX="W1700K-OpenWrt_"
        [ "${{ matrix.target }}" = "ubi2-oc" ] && PREFIX="W1700K-OpenWrt-OC_"
        VERSION="${PREFIX%_}-r$(jq -r '.version_code' firmware/profiles.json | sed 's/^r//; s/-.*//')-$(TZ=Asia/Hong_Kong date +'%y.%m.%d-%H.%M.%S')"
        echo "$VERSION" > firmware/version.txt
        RELEASE_NOTES="firmware/release-notes.md"
        if [ "${{ matrix.target }}" = "ubi2" ]; then
          cat > "$RELEASE_NOTES" <<EOF
        ## Quantum Fiber / Gemtek W1700K OpenWrt — ubi2 标准版

        **推荐版本。** 使用标准 CPU 工作参数，优先保障稳定性，适合绝大多数 W1700K 用户日常使用。

        - 机型：Quantum Fiber / Gemtek W1700K
        - 固件分支：\`ubi2\`
        - 构建时间：$(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M:%S %Z')
        - 固件源码：https://github.com/OpenWRT-fanboy/OpenW1700k
        - 本 Release 仅包含 \`sysupgrade.itb\` 升级镜像。

        请确认设备为 W1700K，并在刷写前备份当前配置。
        EOF
        else
          cat > "$RELEASE_NOTES" <<EOF
        ## Quantum Fiber / Gemtek W1700K OpenWrt — ubi2-oc 超频版

        **超频版本：默认性能模式并超频 +200 MHz。**

        - 机型：Quantum Fiber / Gemtek W1700K
        - 固件分支：\`ubi2-oc\`
        - 构建时间：$(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M:%S %Z')
        - 固件源码：https://github.com/OpenWRT-fanboy/OpenW1700k
        - 本 Release 仅包含 \`sysupgrade.itb\` 升级镜像。

        刷写前请确认设备为 W1700K，并备份当前配置。
        EOF
        fi

    - name: Create release
      env:
        GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      run: |
        VERSION="$(cat firmware/version.txt)"
        gh release create "$VERSION" firmware/*sysupgrade.itb --target "$GITHUB_SHA" --title "$VERSION" --notes-file firmware/release-notes.md
        PREFIX="W1700K-OpenWrt_"
        [ "${{ matrix.target }}" = "ubi2-oc" ] && PREFIX="W1700K-OpenWrt-OC_"
        gh release list --json tagName --jq '.[].tagName' | grep -E "^(${PREFIX}|${PREFIX%_}-r[0-9]+-|W1700K-${{ matrix.target }}_)" | grep -vxF "$VERSION" | xargs -r -n1 gh release delete --cleanup-tag -y ||:

    # One generation per target/type: <= 2*(2GB toolchain + 1.5GB ccache)
    # + 2.2GB downloads. API admission also counts unrelated/legacy caches.
    - name: Pack bounded caches
      run: |
        docker_exec DK python3 /cache-scripts/cache.py ccache /ghcache /ccarchive unused
        if [ '${{ steps.tc.outputs.cache-hit }}' != true ]; then
          docker_exec DK python3 /cache-scripts/cache.py toolchain "$DK_OPENWRT" /tcarchive '${{ steps.inputs.outputs.key }}'
        fi
        if [ '${{ matrix.target }}' = ubi2 ] && [ '${{ steps.dl_changed.outputs.save }}' = true ]; then
          docker_exec DK python3 /cache-scripts/cache.py dl /dlcache /dlarchive unused
        fi
        sudo chown -R "$(id -u):$(id -g)" tcarchive ccarchive dlarchive
    - id: tc_budget
      if: steps.tc.outputs.cache-hit != 'true'
      run: python3 scripts/cache.py admit tcarchive 'tc-v3-${{ matrix.target }}-' '${{ steps.inputs.outputs.key }}'
    - uses: actions/cache/save@main
      if: steps.tc_budget.outputs.save == 'true' && hashFiles('tcarchive/toolchain.tar.gz') != ''
      with: {path: tcarchive, key: '${{ steps.inputs.outputs.key }}'}
    - id: cc_budget
      run: python3 scripts/cache.py admit ccarchive 'cc-v3-${{ matrix.target }}.' '${{ steps.gh.outputs.cache-primary-key }}'
    - uses: actions/cache/save@main
      if: steps.cc_budget.outputs.save == 'true' && hashFiles('ccarchive/ccache.tar.gz') != ''
      with: {path: ccarchive, key: '${{ steps.gh.outputs.cache-primary-key }}'}
    - id: dl_budget
      if: matrix.target == 'ubi2' && steps.dl_changed.outputs.save == 'true'
      run: python3 scripts/cache.py admit dlarchive 'dl-v3.' '${{ steps.dl.outputs.cache-primary-key }}'
    - uses: actions/cache/save@main
      if: matrix.target == 'ubi2' && steps.dl_changed.outputs.save == 'true' && steps.dl_budget.outputs.save == 'true' && hashFiles('dlarchive/dl.tar.gz') != ''
      with: {path: dlarchive, key: '${{ steps.dl.outputs.cache-primary-key }}'}
